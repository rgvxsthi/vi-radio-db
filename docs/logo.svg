<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" role="img" aria-labelledby="logo-title">
  <title id="logo-title">VI Radio DB: a radio tuning dial</title>
  <defs>
    <linearGradient id="sunset" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ff8a5b"/>
      <stop offset="0.5" stop-color="#e9457f"/>
      <stop offset="1" stop-color="#6d3fc7"/>
    </linearGradient>
  </defs>
  <rect width="64" height="64" rx="16" fill="url(#sunset)"/>
  <g fill="none" stroke="#fff" stroke-linecap="round">
    <!-- dial arc and tick marks -->
    <path d="M12 41a20 20 0 0 1 40 0" stroke-width="4"/>
    <path d="M20.3 29.3l2.2 2.2M32 22.5v3M43.7 29.3l-2.2 2.2" stroke-width="3" stroke-opacity="0.85"/>
    <!-- needle -->
    <path d="M32 41l8.6-14.9" stroke-width="3.5"/>
    <!-- tuner scale -->
    <path d="M17 51h30" stroke-width="3" stroke-opacity="0.6"/>
  </g>
  <circle cx="32" cy="41" r="4.5" fill="#fff"/>
</svg>

name: "Wrong song or wrong station"
description: "A song is listed under the wrong station, or isn't in the game at all."
title: "[Wrong song] "
labels: ["wrong song"]
body:
  - type: markdown
    attributes:
      value: |
        Names and links only, please: **no lyrics, no audio files, no game files**. Screenshots of the in-game radio screen are fine.
  - type: dropdown
    id: station
    attributes:
      label: "Station it's listed under"
      options:
        - "AfroBank FM"
        - "Back Country Radio"
        - "Circoloco Records Radio"
        - "Cocoteo FM"
        - "Dirty South Classics"
        - "Emotion 98.3"
        - "Flash FM"
        - "Gloriana Blues Radio"
        - "Honey FM"
        - "Kaleidoscope FM"
        - "Leonida Jazz Radio"
        - "Radio La Ola"
        - "Radio On-U"
        - "Stockyard FM"
        - "Symphony FM"
        - "The Chamber 106.6"
        - "The Sniper of La Perle"
        - "The Vault Radio"
        - "V-Rock"
        - "VCRR"
        - "Vice City FM"
        - "Worldwide FM"
        - "Thrillbilly Mud Club Radio"
        - "The Wipe"
        - "WKTT"
        - "Podcasts"
    validations:
      required: true
  - type: input
    id: artist
    attributes:
      label: "Artist (as listed)"
    validations:
      required: true
  - type: input
    id: title
    attributes:
      label: "Title (as listed)"
    validations:
      required: true
  - type: dropdown
    id: problem
    attributes:
      label: "What's wrong?"
      options:
        - "It belongs to another station"
        - "It isn't in the game"
        - "It's listed twice"
        - "Something else"
    validations:
      required: true
  - type: input
    id: correct_station
    attributes:
      label: "Correct station (if another station)"
    validations:
      required: false
  - type: textarea
    id: source
    attributes:
      label: "Source"
      description: "How do you know? A link (wiki page, video with a timestamp, official soundtrack list), or what you saw in the game (station, time of day, a screenshot)."
    validations:
      required: true
  - type: textarea
    id: notes
    attributes:
      label: "Anything else?"
    validations:
      required: false

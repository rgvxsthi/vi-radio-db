name: "Artist or title correction"
description: "A misspelled or incomplete artist or title, a missing featured artist, or wrong capitalisation."
title: "[Correction] "
labels: ["correction"]
body:
  - type: markdown
    attributes:
      value: |
        Names and links only, please: **no lyrics, no audio files, no game files**. Screenshots of the in-game radio screen are fine.
  - type: dropdown
    id: station
    attributes:
      label: "Station"
      options:
        - "AfroBank FM"
        - "Back Country Radio"
        - "Circoloco Records Radio"
        - "Cocoteo FM"
        - "Dirty South Classics"
        - "Emotion 98.3"
        - "Flash FM"
        - "Gloriana Blues Radio"
        - "Honey FM"
        - "Kaleidoscope FM"
        - "Leonida Jazz Radio"
        - "Radio La Ola"
        - "Radio On-U"
        - "Stockyard FM"
        - "Symphony FM"
        - "The Chamber 106.6"
        - "The Sniper of La Perle"
        - "The Vault Radio"
        - "V-Rock"
        - "VCRR"
        - "Vice City FM"
        - "Worldwide FM"
        - "Thrillbilly Mud Club Radio"
        - "The Wipe"
        - "WKTT"
        - "Podcasts"
    validations:
      required: true
  - type: input
    id: current
    attributes:
      label: "As listed now"
      placeholder: "Artist - Title"
    validations:
      required: true
  - type: input
    id: corrected
    attributes:
      label: "Should be"
      placeholder: "Artist - Title"
    validations:
      required: true
  - type: textarea
    id: source
    attributes:
      label: "Source"
      description: "How do you know? A link (wiki page, video with a timestamp, official soundtrack list), or what you saw in the game (station, time of day, a screenshot)."
    validations:
      required: false
  - type: textarea
    id: notes
    attributes:
      label: "Anything else?"
    validations:
      required: false
